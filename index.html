      </div>
      <div class="ctrl-note">${note}</div>
    </div>`;
}

function bindVideoControls(s) {
  const vid = document.getElementById("mainVideo");
  if (!vid) return;
  currentVideoEl = vid;
  const $ = (id) => document.getElementById(id);
  const btnPlay = $("btnPlayPause"), btnLoop = $("btnLoop"), btnMirror = $("btnMirror"), shell = $("vidShell");
  const sync = () => { btnPlay.textContent = vid.paused ? "▶ 播放示範" : "⏸ 暫停"; };
  const toggle = () => { if (vid.paused) vid.play().catch(() => {}); else vid.pause(); };
  vid.addEventListener("click", toggle);
  ["play", "pause", "ended"].forEach((ev) => vid.addEventListener(ev, sync));
  btnPlay.addEventListener("click", toggle);
  $("btnReplay").addEventListener("click", () => { vid.currentTime = 0; vid.play().catch(() => {}); });
  btnLoop.addEventListener("click", () => {
    vid.loop = !vid.loop;
    btnLoop.classList.toggle("active-green", vid.loop);
    btnLoop.textContent = `🔁 循環：${vid.loop ? "開" : "關"}`;
  });
  btnMirror.addEventListener("click", () => {
    mirrorEnabled = !mirrorEnabled;
    shell.classList.toggle("mirrored", mirrorEnabled);
    btnMirror.classList.toggle("active-purple", mirrorEnabled);
    btnMirror.textContent = `🪞 鏡像：${mirrorEnabled ? "開" : "關"}`;
  });
  document.querySelectorAll(".spd-btn").forEach((b) => b.addEventListener("click", () => {
    vid.playbackRate = parseFloat(b.dataset.rate);
    document.querySelectorAll(".spd-btn").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
  }));
  if (s.cues && s.cues.length) {
    vid.addEventListener("timeupdate", () => {
      const t = vid.currentTime;
      let hit = s.cues[0];
      for (const c of s.cues) { if (t >= c.s && t <= c.e + 0.15) { hit = c; break; } }
      $("cueBadge").textContent = hit.badge;
      $("cueText").textContent = hit.text;
      $("capCover").textContent = hit.text;
    });
  }
}

function render() {
  const s = SLIDES[currentIndex];
  const root = document.getElementById("slideRoot");
  setThemeVars(s.group || "ice");
  root.className = "slide" + (["cover", "divider", "finale"].includes(s.type) ? " dark" : "");

  if (s.type === "cover") {
    root.innerHTML = `
      <div class="hero-layout">
        <div>
          <div class="hero-badge">慢步調動作分解・互動點播練習版</div>
          <h1 class="hero-h1">115 大會舞</h1>
          <div class="hero-sub">冰原漂移舞（4 大招）＋ 香蕉恰恰（簡化 5 招）</div>
          <div class="hero-card" onclick="goTo(IDX.divA)">
            <div class="hero-num">1</div>
            <div><h3>第一章：喜德的「冰原漂移舞」（4 大招）</h3><p>把同組動作合在一起，4 個大動作逐一慢速分解，跟著口訣就會跳</p></div>
          </div>
          <div class="hero-card" onclick="goTo(IDX.divB)">
            <div class="hero-num">2</div>
            <div><h3>第二章：Pororo「香蕉恰恰」（簡化版）</h3><p>精簡為 5 個大動作，原地站穩就能跟上，再跟著音樂合練</p></div>
          </div>
          <div class="hero-card blue" onclick="goTo(IDX.divP)">
            <div class="hero-num">3</div>
            <div><h3>音樂合練（慢速暖身 → 原速過關）</h3><p>分段練習，最後挑戰完整版</p></div>
          </div>
          <div class="hero-actions">
            <button class="big-cta primary" onclick="goTo(1)">▶ 開始上課（看兩支舞地圖）</button>
            <button class="big-cta secondary" onclick="goTo(IDX.divP)">🎵 直接進音樂合練</button>
          </div>
        </div>
        <div class="hero-img-box">
          <img src="media/stills/hero_cover_ice.jpg" alt="喜德">
          <img src="media/stills/hero_cover_banana.jpg" alt="香蕉恰恰">
          <div class="hero-img-cap">大家一起開心動一動！</div>
        </div>
      </div>`;
  } else if (s.type === "roadmap") {
    root.innerHTML = `
      <div class="hdr"><div class="hdr-pill">兩支舞地圖</div><div class="hdr-title">點任何一招，直接進入分解練習！</div><div class="hdr-prog">共 9 招</div></div>
      <div class="roadmap-body">
        <div class="tip-banner">第一章是喜德的冰原漂移舞（4 大招），第二章是 Pororo 香蕉恰恰（簡化 5 招）。先慢後快，一招一招練！</div>
        <div class="rm-grid">
          ${ROAD.map(c => `
            <div class="rm-col" style="--c-main:var(--${c.g}-main);--c-soft:var(--${c.g}-soft);">
              <div class="rm-col-hdr"><h3>${c.t}</h3><p>${c.sub}</p></div>
              <div class="rm-col-list">${c.items.map(it => `<div class="rm-item" onclick="goTo(${it.idx})">${it.txt}</div>`).join("")}</div>
            </div>`).join("")}
        </div>
      </div>`;
  } else if (s.type === "divider") {
    root.innerHTML = `
      <div class="div-body">
        <div class="div-badge">${s.badge}</div>
        <div class="div-title">${s.title}</div>
        <div class="div-sub">${s.subtitle}</div>
        <div class="div-cards">${s.bullets.map((b, i) => `<div class="div-card"><div class="div-num">${i + 1}</div><div class="div-card-txt">${b}</div></div>`).join("")}</div>
      </div>`;
  } else if (s.type === "move") {
    const pct = Math.round((s.moveNum / s.moveTotal) * 100);
    root.innerHTML = `
      <div class="hdr"><div class="hdr-pill">${s.badge}</div><div class="hdr-title">${s.title}</div><div class="hdr-prog">${s.progress}</div></div>
      <div class="move-body">
        <div class="left-col">
          <div class="steps-card">
            ${s.steps.map((st, i) => `<div class="step-row" onclick="this.classList.toggle('done')"><div class="step-num">${i + 1}</div><div class="step-txt">${st}</div></div>`).join("")}
            <div class="lyric-bar">🎵 口訣／歌詞提示：${s.lyric}</div>
          </div>
          <div class="stills-label">動作 1 → 2 → 3 分解照片（點照片可放大）</div>
          <div class="stills-row">${s.stills.map(st => `<button class="still-btn" onclick="openLightbox('${st.img}')"><img src="${st.img}" alt="${st.label}"></button>`).join("")}</div>
        </div>
        ${renderVideoBlock(s)}
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>`;
    bindVideoControls(s);
  } else if (s.type === "practice") {
    const pct = Math.round((s.pracNum / s.pracTotal) * 100);
    root.innerHTML = `
      <div class="hdr"><div class="hdr-pill">${s.badge}</div><div class="hdr-title">${s.title}</div><div class="hdr-prog">${s.progress}</div></div>
      <div class="prac-body">
        <div class="prac-card">
          <div class="prac-card-hdr">${s.listTitle}</div>
          <div class="prac-list">${s.items.map(it => `<div class="prac-item ${it.core ? "core" : ""}">${it.text}</div>`).join("")}</div>
        </div>
        ${renderVideoBlock(s)}
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>`;
    bindVideoControls(s);
  } else if (s.type === "finale") {
    root.innerHTML = `
      <div class="hero-layout">
        <div>
          <h1 class="hero-h1" style="color:var(--gold);">太棒了！大成功！</h1>
          <div class="hero-sub">你已經學會 115 大會舞的兩支舞！</div>
          <div class="hero-card" style="border-color:#22C55E;cursor:default;"><div class="hero-num" style="background:#22C55E;color:#fff;">✔</div><div><h3>學會喜德「冰原漂移舞」4 個大動作</h3></div></div>
          <div class="hero-card" style="border-color:#22C55E;cursor:default;"><div class="hero-num" style="background:#22C55E;color:#fff;">✔</div><div><h3>學會 Pororo「香蕉恰恰」簡化 5 個動作</h3></div></div>
          <div class="hero-card" style="border-color:#22C55E;cursor:default;"><div class="hero-num" style="background:#22C55E;color:#fff;">✔</div><div><h3>跟著音樂完成慢速與原速大挑戰</h3></div></div>
          <div class="hero-actions">
            <button class="big-cta primary" onclick="goTo(IDX.prac_A2_full)">🔥 再跳一次冰原漂移舞</button>
            <button class="big-cta secondary" onclick="goTo(IDX.prac_B3_full)">🍌 再跳一次香蕉恰恰</button>
            <button class="big-cta secondary" onclick="goTo(0)">🏠 回到封面</button>
          </div>
        </div>
        <div class="hero-img-box"><img src="media/stills/hero_bye.jpg" alt="蹲下擺姿勢" style="grid-column:1 / -1;"><div class="hero-img-cap">下次再一起跳！</div></div>
      </div>`;
  }
  document.getElementById("pageInd").textContent = `${currentIndex + 1} / ${SLIDES.length}`;
  document.getElementById("btnPrev").disabled = currentIndex === 0;
  document.getElementById("btnNext").disabled = currentIndex === SLIDES.length - 1;
}

function openMenu() {
  document.getElementById("menuTitle").textContent = `📋 快速跳轉目錄（共 ${SLIDES.length} 頁）`;
  document.getElementById("menuGrid").innerHTML = SLIDES.map((s, i) => `
    <button class="menu-item ${i === currentIndex ? "curr" : ""}" onclick="goTo(${i}); closeMenu();">
      <span class="menu-pg">P${String(i + 1).padStart(2, "0")}</span><span>${s.navTitle}</span>
    </button>`).join("");
  document.getElementById("menuModal").classList.add("open");
}
function closeMenu() { document.getElementById("menuModal").classList.remove("open"); }
document.getElementById("btnPrev").addEventListener("click", () => goTo(currentIndex - 1));
document.getElementById("btnNext").addEventListener("click", () => goTo(currentIndex + 1));
document.getElementById("btnMenu").addEventListener("click", openMenu);
document.getElementById("btnCloseMenu").addEventListener("click", closeMenu);
document.getElementById("menuModal").addEventListener("click", (e) => { if (e.target.id === "menuModal") closeMenu(); });
document.getElementById("lightboxModal").addEventListener("click", () => document.getElementById("lightboxModal").classList.remove("open"));
document.getElementById("btnFull").addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {});
});
document.addEventListener("keydown", (e) => {
  if (document.getElementById("menuModal").classList.contains("open")) { if (e.key === "Escape") closeMenu(); return; }
  if (document.getElementById("lightboxModal").classList.contains("open")) { if (e.key === "Escape") document.getElementById("lightboxModal").classList.remove("open"); return; }
  if (e.key === "ArrowRight" || e.key === "PageDown") goTo(currentIndex + 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") goTo(currentIndex - 1);
  else if (e.key === " " && currentVideoEl) { e.preventDefault(); document.getElementById("btnPlayPause").click(); }
  else if ((e.key === "r" || e.key === "R") && currentVideoEl) document.getElementById("btnReplay").click();
  else if ((e.key === "l" || e.key === "L") && currentVideoEl) document.getElementById("btnLoop").click();
  else if ((e.key === "m" || e.key === "M") && currentVideoEl) document.getElementById("btnMirror").click();
});
render();
</script>
</body>
</html>
